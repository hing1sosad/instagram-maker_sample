<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instagram Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f3f3;
  color: #000;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    "Noto Sans KR",
    sans-serif;
}

.wrap {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 36px;
  padding: 36px;
}

.editor {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  height: fit-content;
  box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

.editor h1 {
  margin: 0 0 4px;
  font-size: 24px;
}

.editor p {
  margin: 0 0 20px;
  color: #777;
  font-size: 14px;
}

.editor label {
  display: block;
  margin: 15px 0 6px;
  font-size: 13px;
  font-weight: 700;
}

.editor input,
.editor textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 11px;
  font-size: 14px;
  font-family: inherit;
}

.editor textarea {
  height: 74px;
  resize: none;
}

.editor button {
  width: 100%;
  margin-top: 20px;
  border: none;
  border-radius: 999px;
  padding: 14px;
  background: #000;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.preview {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.phone {
  width: 430px;
  background: #fff;
  border: 1px solid #dbdbdb;
  overflow: hidden;
}

/* 상단바 */
.ig-top {
  height: 48px;
  padding: 0 14px;
  border-bottom: 1px solid #efefef;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.ig-user {
  font-size: 18px;
  font-weight: 700;
}

.ig-icons {
  display: flex;
  gap: 18px;
  font-size: 22px;
}

/* 프로필 */
.profile {
  padding: 18px 16px 10px;
}

.profile-main {
  display: flex;
  align-items: center;
  gap: 28px;
}

.profile-img-wrap {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
}

.profile-img-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  background: #ddd;
  border: 3px solid #fff;
}

.profile-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  transform: scale(1);
  transform-origin: center;
}

.stats {
  flex: 1;
  display: flex;
  justify-content: space-between;
  text-align: center;
}

.stats strong {
  display: block;
  font-size: 17px;
  font-weight: 700;
}

.stats span {
  display: block;
  margin-top: 2px;
  font-size: 13px;
}

.bio {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.45;
}

.bio strong {
  font-weight: 700;
}

.bio p {
  margin: 3px 0 0;
  white-space: pre-line;
}

/* 버튼 */
.profile-buttons {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}

.profile-buttons div {
  flex: 1;
  background: #efefef;
  text-align: center;
  padding: 8px 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
}

.profile-buttons .blue {
  background: #0095f6;
  color: white;
}

/* 하이라이트 */
.highlights {
  display: flex;
  gap: 14px;
  padding: 14px 16px 12px;
  overflow: hidden;
}

.highlight {
  text-align: center;
  width: 66px;
  flex: 0 0 66px;
}

.highlight-circle {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 1px solid #ddd;
  background: #f4f4f4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.highlight span {
  display: block;
  margin-top: 5px;
  font-size: 11px;
}

/* 탭 */
.tabs {
  display: flex;
  border-top: 1px solid #efefef;
  border-bottom: 1px solid #efefef;
}

.tabs div {
  flex: 1;
  text-align: center;
  padding: 11px 0;
  font-size: 19px;
}

.tabs div:first-child {
  border-bottom: 2px solid #000;
}

/* 게시물 */
.post-header {
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
}

.small-profile-wrap {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  overflow: hidden;
  background: #ddd;
  flex: 0 0 34px;
}

.small-profile {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  transform: scale(1);
  transform-origin: center;
}

.post-user-wrap {
  flex: 1;
  line-height: 1.2;
}

.post-user-wrap strong {
  font-size: 14px;
}

.post-user-wrap span {
  display: block;
  font-size: 12px;
  color: #777;
}

.more {
  font-size: 22px;
}

.post-image {
  width: 100%;
  height: 430px;
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #aaa;
  overflow: hidden;
}

.post-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.action-row {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 12px 12px 2px;
  font-size: 25px;
}

.action-row span:last-child {
  margin-left: auto;
}

.likes {
  padding: 0 12px;
  margin: 8px 0 0;
  font-size: 14px;
  font-weight: 700;
}

.caption {
  padding: 0 12px;
  margin: 7px 0 0;
  font-size: 14px;
  line-height: 1.45;
}

.caption strong {
  font-weight: 700;
}

.comments {
  padding: 0 12px;
  margin: 6px 0 0;
  color: #777;
  font-size: 14px;
}

.date {
  padding: 0 12px 16px;
  margin: 8px 0 0;
  color: #999;
  font-size: 11px;
}

/* 하단바 */
.bottom-nav {
  height: 48px;
  border-top: 1px solid #efefef;
  display: flex;
  justify-content: space-around;
  align-items: center;
  font-size: 22px;
}

@media (max-width: 900px) {
  .wrap {
    grid-template-columns: 1fr;
    padding: 18px;
  }

  .phone {
    width: 100%;
    max-width: 430px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <section class="editor">
    <h1>Instagram Maker</h1>
    <p>인스타그램 스타일 프로필과 게시물을 만들어보세요.</p>

    <label>프로필 이미지</label>
    <input type="file" id="profileInput" accept="image/*">

    <label>프로필 사진 크기</label>
  <input type="range" id="profileSizeRange" min="100" max="250" value="100">

    <label>아이디</label>
    <input type="text" id="userIdInput" value="happynueey">

    <label>이름</label>
    <input type="text" id="nameInput" value="Nueey">

    <label>소개글</label>
    <textarea id="bioInput">디자인과 캐릭터를 기록하는 공간
Portfolio · Character · Branding</textarea>

    <label>게시물 수</label>
    <input type="text" id="postCountInput" value="24">

    <label>팔로워</label>
    <input type="text" id="followerInput" value="1.2K">

    <label>팔로잉</label>
    <input type="text" id="followingInput" value="180">

    <label>게시물 이미지</label>
    <input type="file" id="postInput" accept="image/*">

    <label>위치</label>
    <input type="text" id="locationInput" value="Seoul, Korea">

    <label>캡션</label>
    <textarea id="captionInput">오늘의 작업 기록 ✦ 감각적인 무드와 캐릭터 세계관을 담은 디자인 아카이브.</textarea>

    <label>좋아요 수</label>
    <input type="text" id="likeInput" value="2,481">

    <label>댓글 수</label>
    <input type="text" id="commentInput" value="128">

    <label>게시 날짜</label>
    <input type="text" id="dateInput" value="2026년 6월 3일">

    <button id="downloadBtn">이미지로 저장하기</button>
  </section>

  <section class="preview">
    <div class="phone" id="captureArea">

      <div class="ig-top">
        <span class="ig-user" id="topUserId">happynueey</span>
        <div class="ig-icons">
          <span>＋</span>
          <span>☰</span>
        </div>
      </div>

      <div class="profile">
        <div class="profile-main">
          <div class="profile-img-wrap">
            <div class="profile-img-inner">
                <img class="profile-img" id="profilePreview" alt="profile">
             </div>
          </div>

          <div class="stats">
            <div>
              <strong id="postCountPreview">24</strong>
              <span>게시물</span>
            </div>
            <div>
              <strong id="followerPreview">1.2K</strong>
              <span>팔로워</span>
            </div>
            <div>
              <strong id="followingPreview">180</strong>
              <span>팔로잉</span>
            </div>
          </div>
        </div>

        <div class="bio">
          <strong id="namePreview">Nueey</strong>
          <p id="bioPreview">디자인과 캐릭터를 기록하는 공간</p>
        </div>

        <div class="profile-buttons">
          <div class="blue">팔로우</div>
          <div>메시지</div>
          <div>이메일</div>
        </div>
      </div>

      <div class="highlights">
        <div class="highlight">
          <div class="highlight-circle">✦</div>
          <span>design</span>
        </div>
        <div class="highlight">
          <div class="highlight-circle">♡</div>
          <span>mood</span>
        </div>
        <div class="highlight">
          <div class="highlight-circle">☁</div>
          <span>daily</span>
        </div>
        <div class="highlight">
          <div class="highlight-circle">＋</div>
          <span>new</span>
        </div>
      </div>

      <div class="tabs">
        <div>▦</div>
        <div>▶</div>
        <div>◎</div>
      </div>

      <div class="post-header">
         <div class="small-profile-wrap">
          <img class="small-profile" id="smallProfilePreview" alt="profile">
         </div>

          <div class="post-user-wrap">
            <strong id="postUserId">happynueey</strong>
            <span id="locationPreview">Seoul, Korea</span>
          </div>
          <div class="more">⋯</div>
        </div>

      <div class="post-image" id="postImageBox">
        <span>게시물 이미지</span>
      </div>

      <div class="action-row">
        <span>♡</span>
        <span>💬</span>
        <span>↗</span>
        <span>⌑</span>
      </div>

      <p class="likes">
        좋아요 <span id="likePreview">2,481</span>개
      </p>

      <p class="caption">
        <strong id="captionUserId">happynueey</strong>
        <span id="captionPreview">오늘의 작업 기록 ✦</span>
      </p>

      <p class="comments">
        댓글 <span id="commentPreview">128</span>개 모두 보기
      </p>

      <p class="date" id="datePreview">2026년 6월 3일</p>

      <div class="bottom-nav">
        <span>⌂</span>
        <span>⌕</span>
        <span>＋</span>
        <span>♡</span>
        <span>◉</span>
      </div>

    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const profileInput = document.getElementById("profileInput");
const postInput = document.getElementById("postInput");

const userIdInput = document.getElementById("userIdInput");
const nameInput = document.getElementById("nameInput");
const bioInput = document.getElementById("bioInput");
const postCountInput = document.getElementById("postCountInput");
const followerInput = document.getElementById("followerInput");
const followingInput = document.getElementById("followingInput");
const locationInput = document.getElementById("locationInput");
const captionInput = document.getElementById("captionInput");
const likeInput = document.getElementById("likeInput");
const commentInput = document.getElementById("commentInput");
const dateInput = document.getElementById("dateInput");

const topUserId = document.getElementById("topUserId");
const postUserId = document.getElementById("postUserId");
const captionUserId = document.getElementById("captionUserId");
const namePreview = document.getElementById("namePreview");
const bioPreview = document.getElementById("bioPreview");
const postCountPreview = document.getElementById("postCountPreview");
const followerPreview = document.getElementById("followerPreview");
const followingPreview = document.getElementById("followingPreview");
const locationPreview = document.getElementById("locationPreview");
const captionPreview = document.getElementById("captionPreview");
const likePreview = document.getElementById("likePreview");
const commentPreview = document.getElementById("commentPreview");
const datePreview = document.getElementById("datePreview");

const profilePreview = document.getElementById("profilePreview");
const smallProfilePreview = document.getElementById("smallProfilePreview");
const postImageBox = document.getElementById("postImageBox");

const downloadBtn = document.getElementById("downloadBtn");
const captureArea = document.getElementById("captureArea");

const profileSizeRange = document.getElementById("profileSizeRange");

function updateText() {
  const userId = userIdInput.value;

  topUserId.textContent = userId;
  postUserId.textContent = userId;
  captionUserId.textContent = userId;

  namePreview.textContent = nameInput.value;
  bioPreview.textContent = bioInput.value;

  postCountPreview.textContent = postCountInput.value;
  followerPreview.textContent = followerInput.value;
  followingPreview.textContent = followingInput.value;

  locationPreview.textContent = locationInput.value;
  captionPreview.textContent = captionInput.value;
  likePreview.textContent = likeInput.value;
  commentPreview.textContent = commentInput.value;
  datePreview.textContent = dateInput.value;
}

function updateProfileImageScale(size) {

  const scale = size / 100;

  profilePreview.style.transform =
    "scale(" + scale + ")";

  smallProfilePreview.style.transform =
    "scale(" + scale + ")";

}

[
  userIdInput,
  nameInput,
  bioInput,
  postCountInput,
  followerInput,
  followingInput,
  locationInput,
  captionInput,
  likeInput,
  commentInput,
  dateInput
].forEach(function(input) {
  input.addEventListener("input", updateText);
});

profileSizeRange.addEventListener("input", function() {

  updateProfileImageScale(
    profileSizeRange.value
  );

});


profileInput.addEventListener("change", function() {
  const file = profileInput.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    profilePreview.src = e.target.result;
    smallProfilePreview.src = e.target.result;
  };

  reader.readAsDataURL(file);
});

postInput.addEventListener("change", function() {
  const file = postInput.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    postImageBox.innerHTML = '<img src="' + e.target.result + '" alt="게시물 이미지">';
  };

  reader.readAsDataURL(file);
});

downloadBtn.addEventListener("click", function() {
  html2canvas(captureArea, {
    scale: 2,
    backgroundColor: "#ffffff"
  }).then(function(canvas) {
    const link = document.createElement("a");
    link.download = "instagram-maker.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
});

updateText();
updateProfileImageScale(100);
</script>

</body>
</html>
